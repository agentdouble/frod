[project]
name = "fraude-detector"
version = "0.1.0"
description = "Pipeline explicable de detection d'indices de fraude dans des PDF d'assurance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "c2pa-python>=0.37,<0.38",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pypdf>=6.0",
    "pypdfium2>=5.0,<6",
    "pyyaml>=6.0",
    "streamlit>=1.47,<2",
]

[project.scripts]
fraude-detect = "fraude_detector.cli:main"
frod = "fraude_detector.cli:main"

[project.optional-dependencies]
ai = [
    "huggingface-hub>=0.30,<2",
    "peft>=0.15,<1",
    "safetensors>=0.5,<1",
    "timm==1.0.15",
    "torch==2.7.1",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "reportlab>=4.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraude_detector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
