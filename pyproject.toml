[project]
name = "fraude-detector"
version = "0.1.0"
description = "Pipeline explicable de detection d'indices de fraude dans des PDF d'assurance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pypdf>=6.0",
    "pypdfium2>=5.0,<6",
]

[project.scripts]
fraude-detect = "fraude_detector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "reportlab>=4.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraude_detector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
